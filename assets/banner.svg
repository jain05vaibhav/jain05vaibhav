<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Cyber Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.08)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(157, 78, 221, 0.25)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="180" fill="#00f2fe" opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="1000" cy="300" r="220" fill="#9d4edd" opacity="0.1" filter="url(#neonGlow)" />

  <!-- Cyber Circuit Lines -->
  <g stroke="url(#cyanPurpleGrad)" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 50 80 L 220 80 L 280 140 L 450 140" />
    <circle cx="450" cy="140" r="4" fill="#00f2fe" filter="url(#subtleGlow)" />

    <path d="M 1150 320 L 980 320 L 920 260 L 750 260" />
    <circle cx="750" cy="260" r="4" fill="#9d4edd" filter="url(#subtleGlow)" />

    <path d="M 100 350 L 300 350 L 340 310" />
    <path d="M 1100 50 L 900 50 L 860 90" />
  </g>

  <!-- Corner Brackets -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 25 45 L 25 25 L 45 25" />
    <path d="M 1175 45 L 1175 25 L 1155 25" />
    <path d="M 25 355 L 25 375 L 45 375" />
    <path d="M 1175 355 L 1175 375 L 1155 375" />
  </g>

  <!-- Central Title Elements -->
  <!-- Top Badge -->
  <g transform="translate(600, 95)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1.5" filter="url(#subtleGlow)" />
    <circle cx="-135" cy="0" r="4" fill="#00f59b">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" font-family="'Space Grotesk', 'Segoe UI', monospace" font-size="13" font-weight="600" fill="#00f2fe" letter-spacing="3" text-anchor="middle">
      AI • MACHINE LEARNING • FULL-STACK
    </text>
  </g>

  <!-- Main Name Text -->
  <text x="600" y="200" font-family="'Outfit', 'Montserrat', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="url(#cyanPurpleGrad)" filter="url(#neonGlow)" text-anchor="middle" letter-spacing="6">
    VAIBHAV JAIN
  </text>
  <text x="600" y="200" font-family="'Outfit', 'Montserrat', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    VAIBHAV JAIN
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="255" font-family="'Space Grotesk', 'Fira Code', monospace" font-size="19" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    Engineering Intelligent Autonomous Systems &amp; High-Impact Software
  </text>

  <!-- Futuristic Tech Matrix Badges -->
  <g transform="translate(600, 315)">
    <!-- Pill 1 -->
    <rect x="-370" y="-16" width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="-305" y="5" font-family="monospace" font-size="12" fill="#00f2fe" text-anchor="middle">PyTorch / TF</text>

    <!-- Pill 2 -->
    <rect x="-225" y="-16" width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(157, 78, 221, 0.4)" stroke-width="1" />
    <text x="-160" y="5" font-family="monospace" font-size="12" fill="#d8b4fe" text-anchor="middle">Generative AI</text>

    <!-- Pill 3 -->
    <rect x="-80" y="-16" width="160" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 245, 155, 0.4)" stroke-width="1" />
    <text x="0" y="5" font-family="monospace" font-size="12" fill="#00f59b" text-anchor="middle">Computer Vision</text>

    <!-- Pill 4 -->
    <rect x="95" y="-16" width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="160" y="5" font-family="monospace" font-size="12" fill="#00f2fe" text-anchor="middle">FastAPI / Node</text>

    <!-- Pill 5 -->
    <rect x="240" y="-16" width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 0, 122, 0.4)" stroke-width="1" />
    <text x="305" y="5" font-family="monospace" font-size="12" fill="#ff70a6" text-anchor="middle">C++ / Algorithms</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="450" y1="365" x2="750" y2="365" stroke="url(#cyanPurpleGrad)" stroke-width="2" filter="url(#subtleGlow)" />
  <circle cx="600" cy="365" r="3" fill="#00f2fe" />
</svg>
