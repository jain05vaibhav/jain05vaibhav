<svg viewBox="0 0 850 210" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <!-- Neon Glow Border Gradient -->
    <linearGradient id="hud-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Filters for Cyber Glow -->
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background & Border -->
  <rect x="2" y="2" width="846" height="206" rx="12" fill="url(#hud-bg)" stroke="url(#hud-border)" stroke-width="1.6" filter="url(#hud-glow)"/>

  <!-- Title Bar -->
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 836 2 C 842.63 2 848 7.37 848 14 L 848 34 L 2 34 Z" fill="#0f172a" fill-opacity="0.85"/>
  <line x1="2" y1="34" x2="848" y2="34" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>

  <text x="425" y="22" font-family="'Fira Code', 'Space Grotesk', monospace" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="500">
    vaibhav@neural-system: ~ (python3)
  </text>

  <!-- Terminal Body Lines -->
  <!-- Prompt & Executable -->
  <g font-family="'Fira Code', 'Consolas', monospace" font-size="13">
    <text x="24" y="62">
      <tspan fill="#00f2fe" font-weight="700">vaibhav@neural-system</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7" font-weight="600">~</tspan><tspan fill="#94a3b8">$ </tspan>
      <tspan fill="#f8fafc">python -m pipeline.initialize --user="Vaibhav Jain"</tspan>
    </text>

    <!-- Output 1 -->
    <text x="24" y="92">
      <tspan fill="#10b981" font-weight="700">[✓] SPECIALIZATION </tspan>
      <tspan fill="#cbd5e1">: Machine Learning • Generative AI &amp; LLMs • Computer Vision</tspan>
    </text>

    <!-- Output 2 -->
    <text x="24" y="120">
      <tspan fill="#10b981" font-weight="700">[✓] CORE ARSENAL   </tspan>
      <tspan fill="#38bdf8">PyTorch</tspan><tspan fill="#64748b"> | </tspan>
      <tspan fill="#818cf8">LangChain &amp; RAG</tspan><tspan fill="#64748b"> | </tspan>
      <tspan fill="#a78bfa">FastAPI</tspan><tspan fill="#64748b"> | </tspan>
      <tspan fill="#f472b6">C++ Algorithms</tspan><tspan fill="#64748b"> | </tspan>
      <tspan fill="#34d399">OpenCV &amp; YOLO</tspan>
    </text>

    <!-- Output 3 -->
    <text x="24" y="148">
      <tspan fill="#10b981" font-weight="700">[✓] CURRENT FOCUS  </tspan>
      <tspan fill="#e2e8f0">Autonomous LLM Agents, Pareto Optimization &amp; Real-time AI Systems</tspan>
    </text>

    <!-- Output 4 / Prompt Ready -->
    <text x="24" y="178">
      <tspan fill="#00f2fe" font-weight="700">vaibhav@neural-system</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7" font-weight="600">~</tspan><tspan fill="#94a3b8">$ </tspan>
      <tspan fill="#10b981">ready_for_impact_roles</tspan><tspan fill="#94a3b8"> --collaborate=true</tspan>
    </text>

    <!-- Blinking Cursor -->
    <rect x="420" y="165" width="8" height="15" fill="#00f2fe">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
