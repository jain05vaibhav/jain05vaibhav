<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#090f24"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="gridPat" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
      <circle cx="35" cy="35" r="1" fill="rgba(99, 102, 241, 0.2)"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" fill="url(#gridPat)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="70" r="140" fill="#00f2fe" opacity="0.08" filter="url(#cyberGlow)"/>
  <circle cx="1050" cy="200" r="160" fill="#a855f7" opacity="0.1" filter="url(#cyberGlow)"/>

  <!-- Circuit Neural Paths -->
  <g stroke="url(#neonGrad)" stroke-width="1.4" opacity="0.45" fill="none">
    <path d="M 40 50 L 180 50 L 230 100 L 360 100"/>
    <circle cx="360" cy="100" r="3.5" fill="#00f2fe" filter="url(#subtleGlow)"/>

    <path d="M 1160 230 L 1020 230 L 970 180 L 840 180"/>
    <circle cx="840" cy="180" r="3.5" fill="#a855f7" filter="url(#subtleGlow)"/>

    <path d="M 70 230 L 220 230 L 260 200"/>
    <path d="M 1130 50 L 980 50 L 940 80"/>
  </g>

  <!-- Corner Tech Brackets -->
  <g stroke="#00f2fe" stroke-width="1.8" fill="none" opacity="0.6">
    <path d="M 20 35 L 20 18 L 37 18"/>
    <path d="M 1180 35 L 1180 18 L 1163 18"/>
    <path d="M 20 245 L 20 262 L 37 262"/>
    <path d="M 1180 245 L 1180 262 L 1163 262"/>
  </g>

  <!-- Status Chip -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.2"/>
    <circle cx="-115" cy="0" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" font-family="'Space Grotesk', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#00f2fe" letter-spacing="2" text-anchor="middle">
      AI • MACHINE LEARNING • GENAI
    </text>
  </g>

  <!-- Main Display Typography: VAIBHAV JAIN -->
  <text x="600" y="145" font-family="'Outfit', 'Montserrat', -apple-system, sans-serif" font-size="58" font-weight="900" fill="url(#neonGrad)" filter="url(#cyberGlow)" text-anchor="middle" letter-spacing="4">
    VAIBHAV JAIN
  </text>
  <text x="600" y="145" font-family="'Outfit', 'Montserrat', -apple-system, sans-serif" font-size="58" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    VAIBHAV JAIN
  </text>

  <!-- Dynamic Mission Statement Tagline -->
  <text x="600" y="192" font-family="'Space Grotesk', 'Fira Code', monospace" font-size="15.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Engineering Intelligent Autonomous Systems, Deep Neural Models &amp; Scalable Architectures
  </text>

  <!-- Tech Arsenal Badges -->
  <g transform="translate(600, 235)" font-family="'Fira Code', monospace" font-size="11">
    <g transform="translate(-250, 0)">
      <rect x="-45" y="-12" width="90" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
      <text x="0" y="4" fill="#00f2fe" text-anchor="middle">PyTorch</text>
    </g>
    <g transform="translate(-125, 0)">
      <rect x="-55" y="-12" width="110" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>
      <text x="0" y="4" fill="#a5b4fc" text-anchor="middle">GenAI &amp; LLMs</text>
    </g>
    <g transform="translate(10, 0)">
      <rect x="-60" y="-12" width="120" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(168,85,247,0.35)" stroke-width="1"/>
      <text x="0" y="4" fill="#d8b4fe" text-anchor="middle">Computer Vision</text>
    </g>
    <g transform="translate(145, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="0" y="4" fill="#6ee7b7" text-anchor="middle">FastAPI &amp; APIs</text>
    </g>
    <g transform="translate(265, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
      <text x="0" y="4" fill="#f472b6" text-anchor="middle">C++ Algorithms</text>
    </g>
  </g>
</svg>
