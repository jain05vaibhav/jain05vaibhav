<svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@1,400;1,700&amp;display=swap');
      .quote-text {
        font-family: 'Space Mono', 'Fira Code', monospace;
        font-style: italic;
        font-size: 21px;
        fill: #E2E8F0;
      }
    </style>
    <linearGradient id="bgflat2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="quoteglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0" result="blur">
        <animate attributeName="stdDeviation" values="0;4;0" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.13   0 0 0 0 0.83   0 0 0 0 0.93  0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="110" fill="url(#bgflat2)"/>
  <rect x="0" y="0" width="900" height="110" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.35"/>

  <text x="450" y="52" text-anchor="middle" class="quote-text" filter="url(#quoteglow)">
    "Keep building &#8212; even sinking ships teach you to swim."
  </text>

  <rect x="380" y="70" width="140" height="2" fill="#22D3EE"/>
</svg>
